server:
  host: "0.0.0.0"
  port: 3502
  # Wave 13 C2: REST bearer token. Leave blank here — real value comes from
  # DRAGON_API_TOKEN env (see /home/radxa/.env on Dragon). Middleware fails
  # closed (503) on private routes if this is empty.
  api_token: ""

stt:
  backend: "moonshine"  # moonshine, whisper_cpp, vosk
  model: "medium"
  language: "en"
  # moonshine-specific
  moonshine_model_path: ""
  # whisper_cpp-specific
  whisper_model_path: ""
  # vosk-specific
  vosk_model_path: ""

tts:
  backend: "piper"  # piper, kokoro, edge_tts
  # piper-specific
  piper_model: "en_US-lessac-medium"
  piper_data_dir: ""
  # kokoro-specific
  kokoro_model_path: ""
  kokoro_voice: "af_heart"
  # edge_tts-specific
  edge_voice: "en-US-AriaNeural"

  sample_rate: 22050

llm:
  local_backend: "ollama"  # Stores original local backend for cloud-to-local fallback
  backend: "ollama"  # ollama, openrouter, lmstudio, npu_genie, tinkerclaw, dual
  # ollama
  ollama_url: "http://localhost:11434"
  # Default local LLM for voice_mode=0 (Local) and the LLM side of mode 1 (Hybrid).
  # Selected 2026-04-24 from the 11-model gauntlet audit: ministral-3:3b was the
  # only tested model that (a) fit inside Tab5's ~30 s WS keepalive ceiling, (b)
  # fired the calculator tool with the correct answer on a non-memorized number
  # (456*789=359,784), (c) cleanly stored a fact to the memory DB without leaking
  # prior-session context, and (d) produced a user-visible reply on 4/5 prompts.
  # See CLAUDE.md "Local LLM Benchmarks" + LEARNINGS.md 2026-04-24 entry for
  # the full gauntlet table, the three failure classes (too-small / too-slow /
  # fluent-hallucinator) we ruled out, and the re-benchmark methodology.
  ollama_model: "ministral-3:3b"
  # openrouter
  openrouter_api_key: ""  # reads from OPENROUTER_API_KEY env var if empty
  openrouter_model: "anthropic/claude-3.5-haiku"
  openrouter_url: "https://openrouter.ai/api/v1"
  # lmstudio
  lmstudio_url: "http://localhost:1234/v1"
  lmstudio_model: "default"

  # TinkerClaw agent gateway (optional sidecar)
  tinkerclaw_url: "http://localhost:18789"
  # Wave 13 H7: tinkerclaw_token MUST stay blank here. Inject via the
  # TINKERCLAW_TOKEN env var (see /home/radxa/.env loaded by systemd
  # EnvironmentFile=). TinkerClawBackend raises at construction if the
  # token resolves to blank, so a misconfigured gateway no-ops loudly.
  tinkerclaw_token: ""
  tinkerclaw_model: "minimax/MiniMax-M2.5"

  # Dual-model pipeline (used only when backend=="dual").  Pairs a fast
  # tool-picker (xLAM) with a warm responder (ministral) — see
  # docs/PLAN-dual-model-pipeline.md.  Sub-backends default to "ollama"
  # if blank.  To opt in: set `backend: "dual"` above; everything else
  # stays the same.
  dual_picker_backend: ""
  dual_picker_model: "hf.co/Salesforce/xLAM-2-1b-fc-r-gguf:Q4_K_M"
  dual_responder_backend: ""
  dual_responder_model: "ministral-3:3b"

  # ── Multi-model router (#183) — opt-in by setting backend: "router" above ──
  # Capability-aware fleet: each entry declares its modalities; router picks
  # per-turn based on the message's required caps + the active voice_mode tier.
  # See dragon_voice/llm/router.py for the routing rules.  Default empty list
  # leaves single-backend dispatch unchanged.
  #
  # Recommended fleet (verified live against OpenRouter 2026-04-27).
  # To enable: change `backend:` above to `"router"`, uncomment the block
  # below, and ensure your daily spend cap (Tab5 NVS `cap_mils`) is sized
  # for the cloud-tier traffic you expect.
  fleet: []
  # fleet:
  #   # ── Local tier ──
  #   - {id: ministral,    backend: ollama,     model_id: "ministral-3:3b",
  #      caps: [text, tool_calling],          tier: local, priority: 0,  keep_alive_s: 600}
  #   - {id: minicpm_v4,   backend: ollama,
  #      model_id: "hf.co/openbmb/MiniCPM-V-4-gguf:Q4_K_M",
  #      caps: [text, vision, video],         tier: local, priority: 10, keep_alive_s: 120}
  #   # ── Cloud tier ──
  #   # Cheap text + tools default — DeepSeek V4 Flash ($0.14/$0.28)
  #   - {id: ds_v4_flash,  backend: openrouter, model_id: "deepseek/deepseek-v4-flash",
  #      caps: [text, tool_calling],          tier: cloud, priority: 0}
  #   # Cheap multimodal default — Qwen 3.6 Flash, 1M ctx ($0.25/$1.50)
  #   - {id: qwen36_flash, backend: openrouter, model_id: "qwen/qwen3.6-flash",
  #      caps: [text, vision, tool_calling],  tier: cloud, priority: 5}
  #   # Native video — Gemini 3 Flash Preview ($0.50/$3.00)
  #   - {id: gemini_flash, backend: openrouter, model_id: "google/gemini-3-flash-preview",
  #      caps: [text, vision, video, audio_in, tool_calling],
  #                                           tier: cloud, priority: 8}
  #   # Quality vision + tool chains — Sonnet 4.6 ($3/$15)
  #   - {id: sonnet_46,    backend: openrouter, model_id: "anthropic/claude-sonnet-4.6",
  #      caps: [text, vision, tool_calling],  tier: cloud, priority: 12}
  #   # Native multimodal frontier — Gemini 3.1 Pro Preview ($2/$12)
  #   - {id: gemini_pro,   backend: openrouter, model_id: "google/gemini-3.1-pro-preview",
  #      caps: [text, vision, video, audio_in, tool_calling],
  #                                           tier: cloud, priority: 18}
  #   # Top-tier agentic — Opus 4.7 ($5/$25)
  #   - {id: opus_47,      backend: openrouter, model_id: "anthropic/claude-opus-4.7",
  #      caps: [text, vision, tool_calling],  tier: cloud, priority: 25}
  #   # Frontier — GPT-5.5 ($5/$30)
  #   - {id: gpt_55,       backend: openrouter, model_id: "openai/gpt-5.5",
  #      caps: [text, vision, tool_calling],  tier: cloud, priority: 30}

  system_prompt: "You are Tinker, a helpful AI assistant. Reply in 1-2 sentences maximum. Be concise. Never simulate user responses. Never generate text after your answer. Stop immediately after answering."
  max_tokens: 256
  temperature: 0.7

audio:
  input_sample_rate: 16000
  input_channels: 1
  output_sample_rate: 22050
  vad_enabled: true
  vad_silence_ms: 1500

# Database maintenance
database:
  message_retention_days: 30  # Purge messages older than this (0 = never purge)

# Tools configuration
tools:
  enabled: true
  max_tool_calls: 3
  web_search_engine: "duckduckgo"
  searxng_url: ""  # Set to http://localhost:8888 to use SearXNG
