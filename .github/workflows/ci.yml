name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          # aiosqlite is used by dragon_voice.db but wasn't in requirements.txt.
          pip install aiosqlite
          pip install -r requirements.txt
          # Test + lint + type-check tooling.  W14-M15 / #51: mypy
          # gates a curated strict-clean list (see "Type-check" step
          # below); not all of dragon_voice/ is strict-clean yet.
          pip install ruff pytest pytest-asyncio mypy

      - name: Lint (ruff — real-bug gate)
        run: |
          # Wave 14 W14-M16: expanded from the wave-13 gate.  Original gate
          # was F821/F722/F811/F823/B006 — the minimum that catches crashes.
          # Wave-14 adds four codes that catch real bugs with zero/minimal
          # style churn (all 18 tree findings closed in the same PR):
          #   B904  raise ... from err / from None  (preserves traceback)
          #   E722  bare except                     (catches KeyboardInterrupt)
          #   B007  unused loop control var         (usually a rename bug)
          #   RUF006 asyncio-dangling-task          (task GC'd mid-run)
          # Not yet promoted (need structural refactors):
          #   ASYNC230/240 blocking I/O in async    → W14-H08
          #   BLE001 blind except (~100 hits)       → W14-H13
          ruff check --select F821,F722,F811,F823,B006,B904,E722,B007,RUF006 \
            dragon_voice/ dashboard.py tests/

      - name: Type-check (mypy --strict, curated clean list)
        run: |
          # W14-M15 / #51: mypy --strict on a deliberately-narrow set of
          # files.  Adding a file to this list means it must pass strict
          # checks today AND every PR that touches it.  Use
          # --follow-imports=silent so transitive untyped modules don't
          # fail the gate; the strict invariant only applies to the
          # NAMED files.  Expand the list as more modules get annotated
          # — see docs/MYPY-CLEAN-LIST.md for the policy.
          python -m mypy --strict --follow-imports=silent \
            dragon_voice/api/__init__.py \
            dragon_voice/api/utils.py \
            dragon_voice/api/system.py

      - name: Run unit + middleware tests
        env:
          DRAGON_API_TOKEN: ci-bearer-token
          TINKERCLAW_TOKEN: ci-tc-token
        run: |
          # Dragon E2E suite requires a live server -- skip it in CI and only
          # run the pure-unit + middleware tests that pass without I/O.
          python -m pytest -v \
            tests/test_auth_middleware.py \
            tests/test_session_cas.py \
            tests/test_media_store.py \
            tests/test_media_pipeline.py \
            tests/test_mcp_bridge.py \
            tests/test_notes_db_async.py \
            tests/test_paused_session_retention.py \
            tests/test_progress_bus_integration.py \
            tests/test_progress_emit.py \
            tests/test_progress_event.py \
            tests/test_scheduler_api.py \
            tests/test_scheduler_manager.py \
            tests/test_scheduler_replay.py \
            tests/test_scheduler_store_sqlite.py \
            tests/test_scheduler_tool.py \
            tests/test_scheduler_when_parser.py \
            tests/test_config_redact.py \
            tests/test_device_evicted.py \
            tests/test_document_size_cap.py \
            tests/test_errors.py \
            tests/test_tinkerclaw_health_check.py \
            tests/test_media_upload_413_no_close.py \
            tests/test_media_url_signer.py \
            tests/test_proxy_image_ssrf.py \
            tests/test_security_headers.py \
            tests/test_debug_handlers.py \
            tests/test_lifecycle_monitors.py \
            tests/test_media_cleanup_startup.py \
            tests/test_status_handlers.py \
            tests/test_config_api_handlers.py \
            tests/test_tool_parser.py \
            tests/test_dual_llm.py \
            tests/test_ws_dispatcher_cancellation.py \
            tests/test_dictation_post_process_events.py \
            tests/test_incremental_tool_marker_detection.py \
            tests/test_tts_flush_and_kill.py \
            tests/test_ws_upgrade_errors.py \
            tests/test_looks_like_useful_text.py \
            tests/test_tinkerclaw_streaming.py \
            tests/test_openrouter_tts_errors.py \
            tests/test_max_tool_calls_signal.py \
            tests/test_audio_resample.py \
            tests/test_audio_codec.py \
            tests/test_video_upstream.py \
            tests/test_video_inject.py \
            tests/test_dictation_post_process_race.py \
            tests/test_b6_hybrid_first_utterance.py \
            tests/test_config_update_rate_limit_signal.py \
            tests/test_voice_tts_timeout.py \
            tests/test_tc_pre_stream_cap.py \
            tests/test_dictation_buffer_cap_signal.py \
            tests/test_hybrid_tts_fast_path.py \
            tests/test_missing_key_gamma_arch.py \
            tests/test_d_tier_polish.py \
            tests/test_turn_gate.py \
            tests/test_short_utterance_signal.py \
            tests/test_voice_modes.py \
            tests/test_config_swap.py \
            tests/test_api_messages_post.py \
            tests/test_spend_tracker.py \
            tests/test_start_handler.py \
            tests/test_protocol_contract.py \
            tests/test_tinkerclaw_tool_events.py \
            tests/test_agent_skills_api.py \
            tests/test_channel_reply_handler.py \
            tests/test_debug_channel_push.py \
            tests/test_channels_mock.py
